name: Обновление базы компаний

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать базу
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          MIN_SITELINKS: '10'
        run: python scripts/update_companies.py
      - name: Сохранить изменения
        run: |
          git config user.name "finanedly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Обновление базы компаний $(date +%F)"
          git push
